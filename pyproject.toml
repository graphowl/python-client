[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphowl"
version = "0.1.0"
description = "Python client for GraphOWL: vocabulary, ontology, graph, mapping, inference, validation, governance and query."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["httpx>=0.27", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["graphowl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://graphowl.app"
Repository = "https://github.com/graphowl/python-client"
Issues = "https://github.com/graphowl/graphowl/issues"
